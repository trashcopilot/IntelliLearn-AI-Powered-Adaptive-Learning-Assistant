<div class="attempts-panel">
    <div class="attempts-panel-header">
        <div>
            <div class="attempts-panel-kicker">Recent performance trend</div>
            <p class="attempts-panel-subtitle mb-0">Your last seven quiz attempts, shown in chronological order.</p>
        </div>
        <div class="attempts-panel-pill">7 attempts</div>
    </div>

    <div id="attempt-chart-data" class="visually-hidden" aria-hidden="true">
        {% for item in attempt_data %}
            <span
                class="attempt-chart-point"
                data-label="{{ item.attempt.StartTime|date:'M d' }}"
                data-score="{{ item.attempt.TotalScore }}"
                data-concept="{{ item.concept_name|default:'N/A' }}"
            ></span>
        {% empty %}
            <span class="attempt-chart-point" data-empty="1"></span>
        {% endfor %}
    </div>

    <div class="attempts-chart-wrap attempts-chart-wrap-full">
        <canvas id="progressChart"></canvas>
    </div>
</div>
